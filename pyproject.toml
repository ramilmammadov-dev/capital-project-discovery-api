[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capex-discovery"
version = "1.0.0"
description = "Public-sector capital project discovery, extraction and consolidation API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — delivered to the client" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.5",
    "anthropic>=1.0",
    "typesafe-sdk>=0.7",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rapidfuzz>=3.9",
    "xlsxwriter>=3.2",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "reportlab>=4.2",
]

[project.scripts]
capex = "capex.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
capex = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM102"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
